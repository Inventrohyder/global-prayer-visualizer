name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to (re)deploy preview for
        required: true
        type: string
      ref:
        description: Git ref (branch/SHA) to build for manual preview
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write
  pages: write

jobs:
  preview:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.number }}
      PREVIEW_PATH: previews/pr-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.number }}
      VITE_BASE_PATH: /${{ github.event.repository.name }}/previews/pr-${{ github.event_name == 'workflow_dispatch' && github.event.inputs.pr_number || github.event.number }}/
    steps:
      - name: Checkout PR code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.ref || github.event.pull_request.head.sha }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run type-check
          npm run test

      - name: Build preview
        run: npm run build

      - name: Ensure GitHub Pages is enabled for gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: 'gh-pages', path: '/' };
            try {
              await github.request('PUT /repos/{owner}/{repo}/pages', { owner, repo, source });
              core.info('Configured Pages source to gh-pages/.');
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/pages', { owner, repo, source });
                core.info('Created Pages site with gh-pages/. source.');
              } else {
                throw error;
              }
            }

      - name: Deploy preview to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          target-folder: ${{ env.PREVIEW_PATH }}
          clean: false

      - name: Comment preview URL
        if: github.event_name != 'workflow_dispatch'
        uses: marocchino/sticky-pull-request-comment@v2
        with:
          header: pr-preview
          message: |
            🚀 PR preview deployed:
            https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/${{ env.PREVIEW_PATH }}/
