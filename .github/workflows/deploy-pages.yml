name: Deploy Main to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      VITE_BASE_PATH: /${{ github.event.repository.name }}/
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci

      - name: Validate
        run: |
          npm run lint
          npm run type-check
          npm run test

      - name: Build
        run: npm run build

      - name: Ensure GitHub Pages is enabled for gh-pages branch
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const source = { branch: 'gh-pages', path: '/' };
            try {
              await github.request('PUT /repos/{owner}/{repo}/pages', { owner, repo, source });
              core.info('Configured Pages source to gh-pages/.');
            } catch (error) {
              if (error.status === 404) {
                await github.request('POST /repos/{owner}/{repo}/pages', { owner, repo, source });
                core.info('Created Pages site with gh-pages/. source.');
              } else {
                throw error;
              }
            }

      - name: Deploy root site to gh-pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: gh-pages
          folder: dist
          clean: true
          clean-exclude: |
            previews
            previews/**
